name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's web upload skips files that start with a dot, so make sure this one exists.
      - name: Ensure .env.example exists
        run: '[ -f .env.example ] || echo "# GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Release signing uses ONE permanent key stored in GitHub Actions secrets. If the secrets
      # are missing the build stops: it never falls back to a temporary key, because that would
      # produce an APK that cannot update the installed app.
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing. Refusing to build with a temporary key." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::$(grep -E 'What went wrong|Execution failed|Caused by|error:|e: |Keystore|password|FAILED' -A2 build.log | head -c 1800 | tr '\n' ' ')"
          fi
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: Musicfy-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk

