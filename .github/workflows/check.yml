name: Check (no publish)

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure .env.example exists
        run: '[ -f .env.example ] || echo "# GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Compile and run regression test
        run: gradle :app:testDebugUnitTest --tests 'com.example.RestoredSongLyricsTest' --tests 'com.example.RestoredQueueTest' --no-daemon
